<script>
async function includeHTML(targetId,url){
  const el=document.getElementById(targetId);
  if(!el) return;

  try{
    const res=await fetch(url,{cache:"no-store"});
    el.innerHTML=await res.text();
  }catch(err){
    console.error(err);
  }
}

(async function(){
  await includeHTML("site-header","/partials/header.html");
})();

(async function(){
  await includeHTML("site-footer","/partials/footer.html");

  const yearEl=document.getElementById("year");
  if(yearEl){
    yearEl.textContent=new Date().getFullYear();
  }
})();
</script>

<script>

const MEDIA = [

"/assets/avant-apres/brows-01.mp4",
"/assets/avant-apres/brows-02.mp4",
"/assets/avant-apres/brows-03.mp4",

"/assets/avant-apres/brows-04.webp",
"/assets/avant-apres/brows-05.webp",
"/assets/avant-apres/brows-06.webp",

"/assets/avant-apres/lips-01.webp",
"/assets/avant-apres/lips-02.webp",
"/assets/avant-apres/lips-03.webp",

"/assets/avant-apres/brows-01.webp",
"/assets/avant-apres/brows-02.webp",
"/assets/avant-apres/brows-03.webp"

];

const grid=document.getElementById("aaGrid");
const viewer=document.getElementById("aaViewer");
const box=document.getElementById("aaBox");
const title=document.getElementById("aaTitle");

let idx=0;

function isVideo(src){
  return src.toLowerCase().endsWith(".mp4");
}

function renderGrid(){

  grid.innerHTML="";

  MEDIA.forEach((src,i)=>{

    const tile=document.createElement("div");
    tile.className="aaTile";

    if(isVideo(src)){

      tile.innerHTML=`
        <video muted playsinline preload="metadata">
          <source src="${src}" type="video/mp4">
        </video>
      `;

    }else{

      tile.innerHTML=`
        <img src="${src}" alt="Avant Après">
      `;

    }

    tile.onclick=()=>openViewer(i);

    grid.appendChild(tile);

  });

}

function openViewer(i){
  idx=i;
  viewer.classList.add("open");
  renderViewer();
}

function renderViewer(){

  const src=MEDIA[idx];

  title.textContent=(idx+1)+" / "+MEDIA.length;

  box.innerHTML="";

  if(isVideo(src)){

    box.innerHTML=`
      <video
        controls
        autoplay
        loop
        playsinline
        controlsList="nodownload"
      >
        <source src="${src}" type="video/mp4">
      </video>
    `;

  }else{

    box.innerHTML=`
      <img src="${src}" alt="">
    `;

  }

}

function prev(){
  idx=(idx-1+MEDIA.length)%MEDIA.length;
  renderViewer();
}

function next(){
  idx=(idx+1)%MEDIA.length;
  renderViewer();
}

document.getElementById("aaPrev").onclick=prev;
document.getElementById("aaNext").onclick=next;

document.getElementById("aaClose").onclick=()=>{
  viewer.classList.remove("open");
};

document.addEventListener("contextmenu",(e)=>{
  e.preventDefault();
});

renderGrid();

</script>
